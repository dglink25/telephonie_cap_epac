worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    types_hash_max_size 4096;
    server_tokens off;
    client_max_body_size 110M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    upstream backend {
        server backend:3000;
        keepalive 32;
    }
    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # ══════════════════════════════════════════════════════════════
    # PORT 80 + 19080 — Page d'installation CA + redirect HTTPS
    # ══════════════════════════════════════════════════════════════
    server {
        listen 80;
        listen [::]:80;
        listen 19080;
        listen [::]:19080;
        server_name _;

        # Téléchargement CA racine (pour installation sur les appareils)
        location /rootCA.pem {
            alias /etc/nginx/ssl/rootCA.pem;
            add_header Content-Type application/x-pem-file;
            add_header Content-Disposition 'attachment; filename="cap-epac-CA.pem"';
            add_header Access-Control-Allow-Origin "*";
        }
        location /rootCA.crt {
            alias /etc/nginx/ssl/rootCA.pem;
            add_header Content-Type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="cap-epac-CA.crt"';
            add_header Access-Control-Allow-Origin "*";
        }

        # Page d'installation CA (générée par deploy.sh)
        location /installer-certificat {
            alias /etc/nginx/ssl/install-ca.html;
            add_header Content-Type text/html;
        }

        # Tout le reste → redirect HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════
    # PORT 8080 → 18282 externe — API mobile HTTP pur
    # ══════════════════════════════════════════════════════════════
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering    off;
        }

        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /uploads/ {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }

    # ══════════════════════════════════════════════════════════════
    # PORT 443 + 19443 — HTTPS principal (domaine DNS + IP directe)
    # ══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        listen 19443 ssl http2;
        listen [::]:19443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Micro, caméra, partage écran — obligatoire pour WebRTC
        add_header Permissions-Policy "microphone=(*), camera=(*), speaker-selection=(*), display-capture=(*)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering    off;
            proxy_buffer_size  4k;
        }

        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
            proxy_cache off;
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host     $host;
            proxy_set_header   Range    $http_range;
            proxy_set_header   If-Range $http_if_range;
            expires 30d;
            add_header Cache-Control "public";
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length' always;
        }

        location /api/docs/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
        }
    }
}
