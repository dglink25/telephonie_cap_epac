# ═══════════════════════════════════════════════════════════════
# Coturn — Serveur STUN/TURN pour WebRTC CAP-EPAC (LAN)
# ═══════════════════════════════════════════════════════════════

# ── Réseau ──────────────────────────────────────────────────────
# Remplacer par l'IP LAN du serveur
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349

# IP externe du serveur LAN (à adapter)
relay-ip=192.168.10.150
external-ip=192.168.10.150

# ── Ports pour les flux médias ────────────────────────────────
min-port=49152
max-port=65535

# ── Authentification ──────────────────────────────────────────
# Utilisateur statique pour WebRTC
user=cap-epac:CapEpacTurn2025

# Clé partagée pour tokens temporels
static-auth-secret=CapEpacTurnSecret2025LAN

# Durée de validité des credentials (24h)
credential-lifetime=86400

# ── Protocoles autorisés ──────────────────────────────────────
# UDP uniquement sur LAN (plus performant)
no-tcp-relay

# Activer UDP et TCP pour les clients
lt-cred-mech

# ── Sécurité ──────────────────────────────────────────────────
# Refuser les requêtes depuis des IPs non-LAN
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
# Autoriser le sous-réseau LAN (à adapter)
allowed-peer-ip=192.168.10.0-192.168.10.255
allowed-peer-ip=127.0.0.1

# ── Logging ───────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
verbose
no-stdout-log

# ── Réalm ─────────────────────────────────────────────────────
realm=cap-epac.local

# ── Performance ───────────────────────────────────────────────
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300
stale-nonce=600

# ── Désactiver les services non nécessaires ───────────────────
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
