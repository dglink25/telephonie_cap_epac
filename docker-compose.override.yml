# docker-compose.override.yml
# Les ports sont maintenant configurés dans docker-compose.yml via variables .env
# HTTP_PORT, HTTPS_PORT, MOBILE_PORT

services:
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html/cap-epac:ro
